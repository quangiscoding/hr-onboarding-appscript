<!doctype html>
<html>
  <head>
    <base target="_top" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        font-size: 13px;
        color: #333333;
        margin: 0;
        padding: 16px;
        background-color: #ffffff;
      }
      .header-notice {
        background-color: #fff3cd;
        border: 1px solid #ffeeba;
        color: #856404;
        padding: 10px 14px;
        border-radius: 6px;
        margin-bottom: 16px;
        font-size: 13px;
        line-height: 1.4;
      }

      /* Container Bảng */
      .table-container {
        max-height: 100%;
        overflow-y: auto;
        border: 1px solid #dee2e6;
        border-radius: 6px;
        margin-bottom: 12px;
        padding-right: 2px;
      }

      /* Custom Scrollbar Đỏ Nhạt Mảnh */
      .table-container::-webkit-scrollbar {
        width: 6px;
      }
      .table-container::-webkit-scrollbar-track {
        background: #f8f9fa;
        border-radius: 4px;
      }
      .table-container::-webkit-scrollbar-thumb {
        background: #f5a9b0; /* Đỏ nhạt rõ nét hơn chút */
        border-radius: 4px;
      }
      .table-container::-webkit-scrollbar-thumb:hover {
        background: #ef403e; /* Hover thành đỏ chủ đạo */
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        position: sticky;
        top: 0;
        background-color: #f8f9fa;
        color: #495057;
        text-align: left;
        padding: 10px 8px;
        border-bottom: 2px solid #dee2e6;
        font-weight: bold;
        z-index: 1;
      }
      td {
        padding: 10px 8px;
        border-bottom: 1px solid #e9ecef;
      }
      tr:hover {
        background-color: #f1f3f5;
      }
      .row-badge {
        font-weight: bold;
        color: #0d6efd;
      }
      .footer-note {
        font-size: 12px;
        color: #6c757d;
        font-style: italic;
        margin-bottom: 20px;
      }
      .btn-container {
        text-align: right;
      }
      .btn-close {
        background-color: #ef403e;
        color: #ffffff;
        border: none;
        padding: 8px 18px;
        font-size: 13px;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
      }
      .btn-close:hover {
        background-color: #d32f2f;
      }
    </style>
  </head>
  <body>
    <div class="header-notice">
      ⚠️ Phát hiện <strong><?= candidates.length ?></strong> nhân sự thiếu link
      Avatar trên UC06.
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 12%">Dòng</th>
            <th style="width: 28%">Họ và Tên</th>
            <th style="width: 35%">Email Cá Nhân</th>
            <th style="width: 25%">Chức Danh</th>
          </tr>
        </thead>
        <tbody>
          <? candidates.forEach(function(c) { ?>
          <tr>
            <td class="row-badge">#<?= c.rowNumber ?></td>
            <td style="font-weight: bold; color: #111"><?= c.fullName ?></td>
            <td><?= c.personalEmail ?></td>
            <td><?= c.position || "-" ?></td>
          </tr>
          <? }); ?>
        </tbody>
      </table>
    </div>

    <div class="btn-container">
      <button class="btn-close" onclick="google.script.host.close()">
        Đóng thông báo
      </button>
    </div>
  </body>
</html>
