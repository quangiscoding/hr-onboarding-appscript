<!doctype html>
<html>
  <head>
    <base target="_top" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: Arial, sans-serif;
        font-size: 13px;
        color: #333333;
        margin: 0;
        padding: 16px;
        background-color: #ffffff;
      }
      .header-notice {
        background-color: #fff3cd;
        border: 1px solid #ffeeba;
        color: #856404;
        padding: 10px 14px;
        border-radius: 6px;
        margin-bottom: 16px;
        font-size: 13px;
        line-height: 1.4;
      }
      /* Container Bảng: Tự dãn lấp đầy space Modal */
      .table-container {
        max-height: calc(100vh - 140px);
        overflow-y: auto;
        border: 1px solid #dee2e6;
        border-radius: 6px;
        margin-bottom: 12px;
        padding-right: 2px;
      }
      .table-container::-webkit-scrollbar {
        width: 6px;
      }
      .table-container::-webkit-scrollbar-track {
        background: #f8f9fa;
        border-radius: 4px;
      }
      .table-container::-webkit-scrollbar-thumb {
        background: #f5a9b0;
        border-radius: 4px;
      }
      .table-container::-webkit-scrollbar-thumb:hover {
        background: #ef403e;
      }
      table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }
      th {
        position: -webkit-sticky;
        position: sticky;
        top: 0;
        background-color: #f8f9fa;
        color: #495057;
        text-align: left;
        padding: 10px 8px;
        border-bottom: 2px solid #dee2e6;
        font-weight: bold;
        z-index: 10;
      }
      td {
        padding: 10px 8px;
        border-bottom: 1px solid #e9ecef;
      }
      tr:hover {
        background-color: #f1f3f5;
      }
      .row-badge {
        font-weight: bold;
        color: #0d6efd;
      }
      .status-badge-success {
        color: #198754;
        font-weight: bold;
      }
      .btn-container {
        text-align: right;
      }
      .btn-close {
        background-color: #ef403e;
        color: #ffffff;
        border: none;
        padding: 8px 18px;
        font-size: 13px;
        font-weight: bold;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 10px;
      }
      .btn-close:hover {
        background-color: #d32f2f;
      }
    </style>
  </head>
  <body>
    <!-- Khung thông báo linh hoạt theo Context -->
    <div class="header-notice">
      <? if (noticeType === 'PROCESSED') { ?> ✅
      <strong
        >Tất cả nhân sự onboard hôm nay do bạn phụ trách đã được xử lý và khóa
        trước đó.</strong
      >
      <? } else { ?> ⚠️ Phát hiện <strong><?= candidates.length ?></strong> nhân
      sự thiếu link Avatar tại
      <a
        href="<?= uc06Url ?>"
        target="_blank"
        style="color: #856404; font-weight: bold; text-decoration: underline"
      >
        file UC06 ↗
      </a>
      <? } ?>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th style="width: 12%">Dòng</th>
            <th style="width: 28%">Họ và Tên</th>
            <th style="width: 35%">Email Cá Nhân</th>
            <th style="width: 25%">
              <?= noticeType === 'PROCESSED' ? 'Trạng thái' : 'Chức Danh' ?>
            </th>
          </tr>
        </thead>
        <tbody>
          <? candidates.forEach(function(c) { ?>
          <tr>
            <td class="row-badge">#<?= c.rowNumber ?></td>
            <td style="font-weight: bold; color: #111"><?= c.fullName ?></td>
            <td><?= c.personalEmail || c.workingEmail ?></td>
            <td>
              <? if (noticeType === 'PROCESSED') { ?>
              <span class="status-badge-success">🔒 Đã gửi & Khóa</span>
              <? } else { ?> <?= c.position || "-" ?> <? } ?>
            </td>
          </tr>
          <? }); ?>
        </tbody>
      </table>
    </div>

    <div class="btn-container">
      <button class="btn-close" onclick="google.script.host.close()">
        Đóng thông báo
      </button>
    </div>
  </body>
</html>
