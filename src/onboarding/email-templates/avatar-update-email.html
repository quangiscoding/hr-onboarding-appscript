<div
  style="
    font-family: Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: #333333;
    max-width: 680px;
    margin: 0;
  "
>
  <p style="margin: 0 0 12px 0">Hi IT Ops Team,</p>

  <p style="margin: 0 0 16px 0">
    Nhờ team hỗ trợ cập nhật avatar cho
    <strong><?= it.candidates.length ?></strong> nhân sự mới onboard ngày
    <strong><?= it.todayStr ?></strong> tại file
    <a
      href="<?= it.sheetUrl ?>"
      target="_blank"
      style="color: #0d6efd; font-weight: bold; text-decoration: underline"
      >Hera | On-boarding List</a
    >:
  </p>

  <table
    style="
      width: 100%;
      border-collapse: collapse;
      margin: 0 0 20px 0;
      border-top: 2px solid #ef403e;
      font-size: 13px;
    "
  >
    <thead>
      <tr
        style="
          background-color: #f8f9fa;
          text-align: left;
          border-bottom: 1px solid #dddddd;
        "
      >
        <th style="padding: 10px 8px; color: #444444">Dòng Hera</th>
        <th style="padding: 10px 8px; color: #444444">Họ và tên</th>
        <th style="padding: 10px 8px; color: #444444">Working Email</th>
        <th style="padding: 10px 8px; color: #444444">Chức vụ / Squad</th>
        <th style="padding: 10px 8px; color: #444444">Link Avatar</th>
        <!-- 🌟 CỘT MỚI BỔ SUNG -->
        <th style="padding: 10px 8px; color: #444444; text-align: center">
          Link Hera
        </th>
      </tr>
    </thead>
    <tbody>
      <? it.candidates.forEach(function(item) { ?>
      <tr style="border-bottom: 1px solid #eeeeee">
        <td style="padding: 10px 8px; font-weight: bold; color: #666666">
          <a
            href="<?= item.rowLink ?>"
            target="_blank"
            style="color: #0d6efd; text-decoration: underline"
            >#<?= item.rowNumber ?></a
          >
        </td>
        <td style="padding: 10px 8px; font-weight: bold; color: #111111">
          <?= item.fullName ?>
        </td>
        <td style="padding: 10px 8px; font-weight: bold">
          <? if (item.workingEmail) { ?>
          <span style="color: #111111"><?= item.workingEmail ?></span>
          <? } else { ?>
          <span style="color: #ef403e">Chưa khởi tạo</span>
          <? } ?>
        </td>
        <td style="padding: 10px 8px; color: #555555">
          <?= item.position ?><br />
          <span style="font-size: 11px; color: #888888"><?= item.squad ?></span>
        </td>
        <td style="padding: 10px 8px; font-weight: bold">
          <? if (item.avatarUrl) { ?>
          <a
            href="<?= item.avatarUrl ?>"
            target="_blank"
            style="color: #0d6efd; text-decoration: underline"
            >Xem ảnh Drive</a
          >
          <? if (item.uc06RowLink) { ?>
          <br /><span style="font-size: 11px; font-weight: normal"
            ><a
              href="<?= item.uc06RowLink ?>"
              target="_blank"
              style="color: #666666; text-decoration: underline"
              >(Link Avatar Dòng #<?= item.uc06RowNumber ?>)</a
            ></span
          >
          <? } ?> <? } else { ?>
          <span style="color: #ef403e">Chưa có link</span>
          <? } ?>
        </td>
        <!-- 🌟 DỮ LIỆU CỘT MỚI: DÙNG TEXT LINK GỌN GÀNG -->
        <td style="padding: 10px 8px; text-align: center; font-weight: bold">
          <a
            href="<?= item.rowLink ?>"
            target="_blank"
            style="color: #0d6efd; text-decoration: underline"
          >
            Đi tới dòng #<?= item.rowNumber ?> ↗
          </a>
        </td>
      </tr>
      <? }); ?>
    </tbody>
  </table>

  <div style="text-align: center; margin: 20px 0">

      href="<?= it.sheetUrl ?>"

      style="
        background-color: #ef403e;
        color: #ffffff;
        padding: 10px 22px;
        text-decoration: none;
        border-radius: 6px;
        font-weight: bold;
        font-size: 13px;
        display: inline-block;
      "
    >
      Mở File Hera Onboarding List
    </a>
  </div> -->

  <p style="margin: 0">Em cảm ơn team!</p>
</div>
