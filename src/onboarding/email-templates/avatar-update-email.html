<div
  style="
    font-family: Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: #333333;
    max-width: 680px;
    margin: 0;
  "
>
  <p style="margin: 0 0 12px 0">Hi IT Ops Team,</p>

  <p style="margin: 0 0 16px 0">
    Nhờ team hỗ trợ cập nhật avatar cho
    <strong><?= it.candidates.length ?></strong> nhân sự mới onboard ngày
    <strong><?= it.todayStr ?></strong> tại
    <a
      href="<?= it.sheetUrl ?>"
      target="_blank"
      style="color: #0d6efd; font-weight: bold; text-decoration: underline"
    >
      File Hera | On-boarding List ↗
    </a>
  </p>

  <table
    style="
      width: 100%;
      border-collapse: collapse;
      margin: 0 0 20px 0;
      border-top: 2px solid #ef403e;
      font-size: 13px;
    "
  >
    <thead>
      <tr
        style="
          background-color: #f8f9fa;
          text-align: left;
          border-bottom: 1px solid #dddddd;
        "
      >
        <th style="padding: 10px 8px; color: #444444">Họ và tên</th>
        <th style="padding: 10px 8px; color: #444444">Working Email</th>
        <th style="padding: 10px 8px; color: #444444">Chức vụ / Squad</th>
        <th style="padding: 10px 8px; color: #444444">Avatar</th>
        <th style="padding: 10px 8px; color: #444444; text-align: center">
          Thông tin nhân sự
        </th>
      </tr>
    </thead>
    <tbody>
      <? it.candidates.forEach(function(item) { ?>
      <tr style="border-bottom: 1px solid #eeeeee">
        <td style="padding: 10px 8px; font-weight: bold; color: #111111">
          <?= item.fullName ?>
        </td>
        <td style="padding: 10px 8px; font-weight: bold">
          <? if (item.workingEmail) { ?>
          <span style="color: #111111"><?= item.workingEmail ?></span>
          <? } else { ?>
          <span style="color: #ef403e">Chưa khởi tạo</span>
          <? } ?>
        </td>
        <td style="padding: 10px 8px; color: #555555">
          <?= item.position ?><br />
          <span style="font-size: 11px; color: #888888"><?= item.squad ?></span>
        </td>
        <td style="padding: 10px 8px; font-weight: bold">
          <? if (item.finalAvatarUrl) { ?>
          <a
            href="<?= item.finalAvatarUrl ?>"
            target="_blank"
            style="color: #0d6efd; text-decoration: underline"
          >
            Xem ảnh Drive ↗
          </a>
          <? if (item.finalAvatarCellLink) { ?>
          <br /><span style="font-size: 11px; font-weight: normal">
            <a
              href="<?= item.finalAvatarCellLink ?>"
              target="_blank"
              style="color: #666666; text-decoration: underline"
            >
              (Dòng #<?= item.uc06RowNumber ?><? if (item.isFromSquareBackup) {
              ?> - Cột Ảnh 1:1<? } ?>)
            </a>
          </span>
          <? } ?> <? } else { ?>
          <span style="color: #ef403e">Chưa có link</span>
          <? } ?>
        </td>
        <td style="padding: 10px 8px; text-align: center; font-weight: bold">
          <a
            href="<?= item.rowLink ?>"
            target="_blank"
            style="color: #0d6efd; text-decoration: underline"
          >
            Link ↗
          </a>
        </td>
      </tr>
      <? }); ?>
    </tbody>
  </table>

  <p style="margin: 0">Em cảm ơn team!</p>
</div>
